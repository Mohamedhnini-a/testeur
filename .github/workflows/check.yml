name: Check and Update Working Configs

on:
  workflow_dispatch:
  schedule:
    # كل 6 سوايع - UTC
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    # 360 هو أقصى حد كيسمح بيه GitHub Actions (6 سوايع)
    timeout-minutes: 360 

    steps:
      - name: Checkout
        uses: actions/checkout@v4 # ✅ إصدار صحيح

      - name: Setup Python
        uses: actions/setup-python@v5 # ✅ إصدار صحيح
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Download Xray
        run: |
          # ملاحظة: الإصدار v26.7.28 مشكوك فيه. هادا إصدار معروف ومستقر:
          XRAY_VERSION="v1.8.24"
          wget -q "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip" -O xray.zip
          unzip -q xray.zip -d xray
          chmod +x xray/xray
          ./xray/xray version

      - name: Check configs
        run: |
          # ✅ زدنا -u باش تشوف اللوغات دغيا
          python -u checker.py

      - name: Prepare working_configs.txt
        run: |
          if [ -f working.txt ]; then
            mv working.txt working_configs.txt
          else
            touch working_configs.txt
          fi

      - name: Show result
        run: |
          echo "=============================="
          echo " WORKING CONFIGS"
          echo "=============================="
          echo "Count:"
          wc -l working_configs.txt
          echo
          echo "First configs:"
          head -n 10 working_configs.txt

      - name: Update repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working_configs.txt
          if git diff --cached --quiet; then
            echo "No changes in working_configs.txt"
          else
            git commit -m "Update working configs"
            git push
          fi

      - name: Upload working configs
        uses: actions/upload-artifact@v4 # ✅ إصدار صحيح
        with:
          name: working-configs
          path: working_configs.txt
          if-no-files-found: error
