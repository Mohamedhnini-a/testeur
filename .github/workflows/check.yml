name: Check and Update Working Configs

on:
  workflow_dispatch:
  schedule:
    # كل 6 سوايع - UTC
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    # 360 هو أقصى حد كيسمح بيه GitHub Actions (6 سوايع)
    timeout-minutes: 360 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 1. تنصيب Node.js باش نقدرو نشغلو generate.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 2. تشغيل generate.js (غادي يخدم ويسالي ويكتب sub.txt)
      - name: Run generate.js
        run: |
          node generate.js
          echo "=== تأكدنا بلي sub.txt تخلق ==="
          ls -lh sub.txt
          wc -l sub.txt

      # 3. تحميل Xray (بحال ما كان)
      - name: Download Xray
        run: |
          XRAY_VERSION="v1.8.24"
          wget -q "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip" -O xray.zip
          unzip -q xray.zip -d xray
          chmod +x xray/xray
          ./xray/xray version

      # 4. تشغيل checker.py (غادي يبدا من بعد ما يسالي generate.js)
      - name: Check configs
        run: |
          python -u checker.py

      - name: Prepare working_configs.txt
        run: |
          if [ -f working.txt ]; then
            mv working.txt working_configs.txt
          else
            touch working_configs.txt
          fi

      - name: Show result
        run: |
          echo "=============================="
          echo " WORKING CONFIGS"
          echo "=============================="
          echo "Count:"
          wc -l working_configs.txt
          echo
          echo "First configs:"
          head -n 10 working_configs.txt

      # هادي مهمة باش يترفع sub.txt مع working_configs.txt
      - name: Update repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working_configs.txt sub.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update working configs and sub.txt"
            git push
          fi

      - name: Upload working configs
        uses: actions/upload-artifact@v4
        with:
          name: working-configs
          path: working_configs.txt
          if-no-files-found: error
