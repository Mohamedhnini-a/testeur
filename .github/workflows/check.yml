name: Check and Update Working Configs

on:
  workflow_dispatch:

  schedule:
    # كل 24 ساعة - 00:00 UTC
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ==========================================
      # Checkout repository
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v5


      # ==========================================
      # Setup Python
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # ==========================================
      # Install dependencies
      # ==========================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests


      # ==========================================
      # Download Xray
      # ==========================================

      - name: Download Xray
        run: |

          XRAY_VERSION="v26.7.28"

          wget -q \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip" \
            -O xray.zip

          unzip -q xray.zip -d xray

          chmod +x xray/xray

          ./xray/xray version


      # ==========================================
      # Run checker
      # ==========================================

      - name: Check configs
        run: |
          python checker.py


      # ==========================================
      # Prepare subscription file
      # ==========================================

      - name: Prepare working_configs.txt
        run: |

          if [ -f working.txt ]; then
            mv working.txt working_configs.txt
          else
            touch working_configs.txt
          fi


      # ==========================================
      # Show result
      # ==========================================

      - name: Show result
        run: |

          echo "=============================="
          echo " WORKING CONFIGS"
          echo "=============================="

          echo "Count:"
          wc -l working_configs.txt

          echo
          echo "First configs:"
          head -n 10 working_configs.txt


      # ==========================================
      # Commit and push
      # ==========================================

      - name: Update repository
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add working_configs.txt

          if git diff --cached --quiet; then

            echo "No changes in working_configs.txt"

          else

            git commit \
              -m "Update working configs"

            git push

          fi


      # ==========================================
      # Upload artifact
      # ==========================================

      - name: Upload working configs
        uses: actions/upload-artifact@v5
        with:
          name: working-configs
          path: working_configs.txt
          if-no-files-found: error
